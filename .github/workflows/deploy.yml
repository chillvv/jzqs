name: Deploy to Server

# 推送 main 分支（或手动触发）时，自动 SSH 到服务器拉取最新代码并重建容器
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 铁律 3：CI 必须跑测试（禁止 -DskipTests）。部署前先跑全量后端测试。
  # 测试数据源固定连 127.0.0.1:3307（见 backend/src/test/resources/application.yml），
  # 库名 jzqs_test_<uuid>，createDatabaseIfNotExist=true，由 Flyway 自动建表。
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # 与本地一致：JVM 时区 Asia/Shanghai（MySQL TIMESTAMP 往返依赖时区，CI 默认 UTC 会差 8 小时）；
    # APP_JWT_SECRET 兜底（surefire 的 allow-default-secret 在部分 Maven 环境下不可靠）
    env:
      TZ: Asia/Shanghai
      # 注意：不能设 APP_JWT_SECRET —— JwtUtilsTest.requiresExplicitSecret 会因
      # readPropertyOrEnv 读到环境变量而不抛"未配置"异常；surefire systemPropertyVariables
      # 的 allow-default-secret=true 已兜底 ManualCreateTest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Shanghai
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        run: mvn --no-transfer-progress -B test

  # 浏览器层 E2E（Playwright，连真实 dev 栈：mysql + backend + admin）。
  # 首次接入先不阻塞部署（deploy 不依赖它），观察稳定性后再考虑 gate。
  # 账号用 seed-e2e-user.js 播种（哈希与后端 PasswordUtils 一致）。
  e2e:
    name: Admin Browser E2E
    runs-on: ubuntu-latest
    needs: test
    env:
      TZ: Asia/Shanghai
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # backend 固定连 jzqs 库且 url 无 createDatabaseIfNotExist，镜像必须先建库
          MYSQL_DATABASE: jzqs
          TZ: Asia/Shanghai
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 启动 backend（后台；CI 空库由 Flyway 自动建表，无 checksum 校验问题）
        working-directory: ./backend
        run: |
          nohup env JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8" \
            SPRING_DATASOURCE_URL="jdbc:mysql://127.0.0.1:3307/jzqs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai" \
            SPRING_DATASOURCE_USERNAME=root SPRING_DATASOURCE_PASSWORD=root \
            APP_JWT_SECRET="ci-e2e-jwt-secret" WECHAT_DEV_MODE=true \
            mvn -B spring-boot:run > /tmp/backend.log 2>&1 &

      - name: 等待 backend 健康（最多 5 分钟）
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "backend UP after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "backend not healthy, last log:"; tail -50 /tmp/backend.log; exit 1

      - name: 安装 admin 依赖并启动 dev server（后台）
        working-directory: ./admin
        run: |
          npm ci
          nohup npm run dev > /tmp/admin.log 2>&1 &

      - name: 等待 admin（最多 3 分钟）
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:5173 > /dev/null 2>&1; then
              echo "admin UP after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "admin not up, last log:"; tail -50 /tmp/admin.log; exit 1

      - name: 播种 e2e_tester 账号
        working-directory: ./backend/scripts/e2e/browser
        run: |
          npm ci
          node seed-e2e-user.js

      - name: 跑 Playwright E2E
        working-directory: ./backend/scripts/e2e/browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright test admin-e2e.spec.js

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 记录部署来源 commit
        run: |
          echo "触发 commit: ${{ github.sha }}"

      - name: 将服务器 host 加入 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SSH 部署到服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 服务器到 Maven Central 网络慢，构建含依赖下载，默认 10m 超时不够（2026-08-29 曾 574s 超时）
          command_timeout: 30m
          script: |
            set -e
            echo "==> [1/3] 拉取最新代码 (commit: ${{ github.sha }})"
            cd /root/jzqs
            git fetch origin main
            git reset --hard origin/main

            echo "==> [2/3] 构建并重启后端"
            ./build.sh backend

            echo "==> [3/3] 构建并重启前端"
            ./build.sh admin

            echo "==> 部署完成: https://jzqs.top"

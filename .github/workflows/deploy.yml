name: Deploy to Server

# 推送 main 分支（或手动触发）时，自动 SSH 到服务器拉取最新代码并重建容器
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 铁律 3：CI 必须跑测试（禁止 -DskipTests）。部署前先跑全量后端测试。
  # 测试数据源固定连 127.0.0.1:3307（见 backend/src/test/resources/application.yml），
  # 库名 jzqs_test_<uuid>，createDatabaseIfNotExist=true，由 Flyway 自动建表。
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        run: mvn --no-transfer-progress -B test

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 记录部署来源 commit
        run: echo "触发 commit: ${{ github.sha }}"

      - name: 将服务器 host 加入 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SSH 部署到服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "==> [1/3] 拉取最新代码 (commit: ${{ github.sha }})"
            cd /root/jzqs
            git fetch origin main
            git reset --hard origin/main

            echo "==> [2/3] 构建并重启后端"
            ./build.sh backend

            echo "==> [3/3] 构建并重启前端"
            ./build.sh admin

            echo "==> 部署完成: https://jzqs.top"
